<html lang="en">

    <p></p>
    <p></p>

    <p></p>

    <script>
      let allData = document.querySelectorAll("p");

      let array = ["adidas", "nike", "skecthers", "puma", "reebok", "jorden"];

      for (let i = 0; i < allData.length; i++) {
        allData[i].innerText = array[i];
      }

      console.log(allData);
