<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>image</h1>
    <input id="inputText" type="text" />
    <button id="btn">Fetch</button>
    <br />
    <img height="300px" id="image" src="" alt="" />

    <script>
      let inputText = document.querySelector("#inputText");
      let btn = document.querySelector("#btn");
      let image = document.querySelector("#image");

      function show() {
        console.log(inputText.value);

        if(inputText.value == ""){
          alert("first you havet to fill the input")
          return 
        }

        fetch(`https://dog.ceo/api/breed/${inputText.value}/images/random`)
          .then((res) => {
            return res.json();
          })
          .then((res) => {
            console.log(res);
            image.src = res.message;
          })
          .catch((err) => {
            console.log(err);
          });

        inputText.value = "";
      }

      btn.addEventListener("click", show);
    </script>
  </body>
</html>
